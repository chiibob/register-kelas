<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3743B0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Class Register</title>
<style>
/* Layout: phone-first register. Sticky class header, one scrolling list per tab, fixed bottom tab bar. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#141C26; --muted:#5B6776; --line:#D9DEE5;
  --accent:#3743B0; --accent-ink:#FFFFFF; --accent-soft:#E6E8F8;
  --h:#1B7F4B; --h-soft:#DCF2E6; --s:#9A6200; --s-soft:#FBEBC8;
  --i:#1F63B8; --i-soft:#DCEAFB; --a:#B3261E; --a-soft:#FADDDA; --on:#FFFFFF;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#171E27; --ink:#E7ECF2; --muted:#95A1B2; --line:#2A3441;
    --accent:#8F9BFF; --accent-ink:#0F141B; --accent-soft:#222A4D;
    --h:#5FD395; --h-soft:#14352A; --s:#F0B955; --s-soft:#3A2D10;
    --i:#7DB3F5; --i-soft:#142B4A; --a:#F28B82; --a-soft:#44201E; --on:#0F141B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --ink:#E7ECF2; --muted:#95A1B2; --line:#2A3441;
  --accent:#8F9BFF; --accent-ink:#0F141B; --accent-soft:#222A4D;
  --h:#5FD395; --h-soft:#14352A; --s:#F0B955; --s-soft:#3A2D10;
  --i:#7DB3F5; --i-soft:#142B4A; --a:#F28B82; --a-soft:#44201E; --on:#0F141B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{font:15px/1.45 var(--font-body);background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
h2.big{font-size:20px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{width:100%;max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.top select{min-width:0;max-width:56%;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
main.wrap{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.list>*+*{border-top:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px}
.lab{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.no{flex:none;width:20px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--a);border-color:var(--a)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn.danger{color:var(--a);border-color:transparent;background:transparent}
.iconbtn.plain{border-color:transparent;background:transparent;color:var(--muted)}
.txt{height:44px;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
textarea.txt{height:auto;padding:10px 12px;resize:vertical}
.file{width:100%;min-height:44px;padding:8px 0}
.inline{display:flex;gap:8px}

.note{border-radius:12px;padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14px}
.note.warn{background:var(--s-soft)}

.datebar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;padding:10px}
.datepick{position:relative;text-align:center;padding:4px 0}
.dlabel{font:600 17px/1.25 var(--font-display)}
.dsub{font-size:12px;color:var(--muted)}
.dsub.today{color:var(--accent);font-weight:600}
.dsub.away{color:var(--s);font-weight:600}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

.pills{display:grid;gap:6px;grid-template-columns:repeat(3,minmax(0,1fr))}
.pills button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;padding:0 6px}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.has::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--h)}
.chip[aria-pressed="true"].has::after{background:var(--accent-ink)}

.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tl{border-radius:10px;padding:8px 4px;text-align:center}
.tl b{display:block;font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.tl span{font-size:11px;font-weight:600}
.tl.H{background:var(--h-soft);color:var(--h)} .tl.S{background:var(--s-soft);color:var(--s)}
.tl.I{background:var(--i-soft);color:var(--i)} .tl.A{background:var(--a-soft);color:var(--a)}

.arow{display:flex;align-items:center;gap:8px;padding:8px 10px}
.nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.linkname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;font-weight:500;overflow-wrap:anywhere;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.seg{flex:none;display:flex;gap:5px}
.seg button{width:38px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.seg .H{color:var(--h)} .seg .S{color:var(--s)} .seg .I{color:var(--i)} .seg .A{color:var(--a)}
.seg button[aria-pressed="true"]{color:var(--on)}
.seg .H[aria-pressed="true"]{background:var(--h);border-color:var(--h)}
.seg .S[aria-pressed="true"]{background:var(--s);border-color:var(--s)}
.seg .I[aria-pressed="true"]{background:var(--i);border-color:var(--i)}
.seg .A[aria-pressed="true"]{background:var(--a);border-color:var(--a)}
.score{flex:none;width:84px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.three .lab{display:block}
.three b{display:block;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.cap{font-size:11px;color:var(--muted);text-align:center}
.grow{padding:12px;display:flex;flex-direction:column;gap:10px}
.gtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.gname{min-width:0;font-weight:600;overflow-wrap:anywhere}
.att{font-weight:400;font-size:12px;color:var(--muted)}
.gavg{flex:none;text-align:right}
.gavg span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.gavg b{font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.gin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:600;color:var(--muted)}
.field input{height:44px;width:100%;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
input[aria-invalid="true"]{border-color:var(--a);background:var(--a-soft)}

.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 12px 14px}
.lhead>div{min-width:0}
.count{color:var(--muted);font-weight:500;margin-left:4px}
.srow{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px}
.nameedit{flex:1;min-width:0;height:44px;border:1px solid transparent;border-radius:10px;background:transparent;padding:0 8px}
.nameedit:focus{border-color:var(--line);background:var(--bg)}
.crow{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--a-soft)}
details summary{min-height:36px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details[open] summary{margin-bottom:8px}
details>*+*{margin-top:8px}
.empty{padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}

.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 14px;background:none;border:0;text-align:left;color:inherit}
.entry span{min-width:0}
.entry b{font-variant-numeric:tabular-nums;flex:none}
.entry small{color:var(--muted);font-size:12px;display:block}
.ghead{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--bg);font-weight:600}
.ghead b{font-variant-numeric:tabular-nums}

.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:11px;color:var(--muted);font-weight:600;border-top:0}
.tbl .l{text-align:left;white-space:normal;min-width:116px;overflow-wrap:anywhere;padding-left:12px}
.tbl td.low{color:var(--a);font-weight:700}
.tbl th.H{color:var(--h)} .tbl th.S{color:var(--s)} .tbl th.I{color:var(--i)} .tbl th.A{color:var(--a)}
.rangebar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;padding:10px}
.rangebar div{text-align:center}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{min-height:58px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:20}
.lt{display:inline-grid;place-items:center;min-width:48px;height:44px;padding:0 10px;border-radius:10px;font:700 22px var(--font-display)}
.lt.A{background:var(--h-soft);color:var(--h)}.lt.B{background:var(--i-soft);color:var(--i)}
.lt.C{background:var(--s-soft);color:var(--s)}.lt.D{background:var(--a-soft);color:var(--a)}
.lt.none{background:var(--bg);color:var(--muted)}
.auto{display:grid;place-items:center;height:44px;border-radius:10px;background:var(--bg);font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.wheelcard{padding:12px 8px}
#wheel{display:block;width:min(100%,360px);aspect-ratio:1;margin:0 auto}
.btn.big{min-height:52px;font-size:17px}
.bigname{font:700 28px/1.2 var(--font-display);overflow-wrap:anywhere;text-wrap:balance}
.resultcard{text-align:center;align-items:center;min-height:92px;justify-content:center}
.lcount{display:flex!important;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-size:16px!important;line-height:1.5!important}
.crow.info{background:var(--accent-soft)}
.ol{margin:0;padding-left:28px}.ol li{padding:4px 0}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist span{padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <h1>Class Register</h1>
  <select id="classSel" aria-label="Class"></select>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabbar" aria-label="Sections"><div class="wrap">
  <button data-tab="attendance"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12l2 2 4-4"/></svg>Attendance</button>
  <button data-tab="grades"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Grades</button>
  <button data-tab="quiz"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5.5 5.5M4 12h8"/></svg>Quiz</button>
  <button data-tab="summary"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Summary</button>
  <button data-tab="students"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.3c2.4.2 4 2 4 4.7"/></svg>Students</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='classRegister.v1';
var NAMES=['Aditya Pratama','Bunga Lestari','Citra Dewi','Dimas Saputra','Eka Wulandari','Fajar Nugroho'];
var STATUS=[{c:'H',id:'Hadir'},{c:'S',id:'Sakit'},{c:'I',id:'Izin'},{c:'A',id:'Alpha'}];
var SCORES=[{k:'k',id:'Kognitif',ab:'Kog'},{k:'p',id:'Psikomotorik',ab:'Psi'},{k:'a',id:'Afektif',ab:'Afe'}];
var BASIC=[{key:'perkalian',name:'Perkalian'},{key:'pembagian',name:'Pembagian'},{key:'pecahan',name:'Pecahan'},{key:'desimal',name:'Desimal'},{key:'persen',name:'Persen'},{key:'konversi',name:'Konversi'}];
var KIND_NAME={basic:'Basic math test',material:'Material test'};
var DEFAULT_SET={k:'basic',p:'basic',minPct:75,aPct:90,bPct:80,meetings:15};
var VERSION='Version 3 · 16 Nov 2026';
var SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var ICON_L=SVG+'<path d="M15 6l-6 6 6 6"/></svg>';
var ICON_R=SVG+'<path d="M9 6l6 6-6 6"/></svg>';
var ICON_T=SVG+'<path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></svg>';

function $(q){return document.querySelector(q);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return iso(new Date());}
function parseDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function shift(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return iso(d);}
function longDate(s){return parseDate(s).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function shortDate(s){return parseDate(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
function fmt(v){return v==null?'—':String(Number(v.toFixed(1)));}
function validScore(v){return /^\d{1,3}(\.\d{0,2})?$/.test(v)&&Number(v)<=100;}

/* ---------- data ---------- */
function defaultBasic(cid){return BASIC.map(function(b){return {id:uid(),classId:cid,name:b.name};});}
function seed(){
  var cid=uid();
  var st=NAMES.map(function(n){return {id:uid(),classId:cid,name:n,ex:true};});
  var vals=[[82,78,90],[91,85,88],[67,72,80],null,[74,80,85],[88,90,92]];
  var g={};
  vals.forEach(function(v,i){if(v)g[st[i].id]={k:v[0],p:v[1],a:v[2]};});
  return {v:3,classes:[{id:cid,name:'Kelas 7A'}],students:st,attendance:{},grades:g,materials:[],basicTypes:defaultBasic(cid),tests:{},notes:{},settings:Object.assign({},DEFAULT_SET),currentClass:cid};
}
function normalize(o){
  o.v=3;o.attendance=o.attendance||{};o.grades=o.grades||{};o.tests=o.tests||{};o.notes=o.notes||{};
  o.materials=Array.isArray(o.materials)?o.materials:[];
  o.settings=Object.assign({},DEFAULT_SET,o.settings||{});
  if(!Array.isArray(o.basicTypes)){
    o.basicTypes=[];
    o.classes.forEach(function(c){
      var map={};
      BASIC.forEach(function(b){var id=uid();map[b.key]=id;o.basicTypes.push({id:id,classId:c.id,name:b.name});});
      var t=o.tests[c.id];
      if(t&&t.basic){var nb={};for(var k in t.basic){nb[map[k]||k]=t.basic[k];}t.basic=nb;}
    });
  }
  if(!o.classes.some(function(c){return c.id===o.currentClass;}))o.currentClass=o.classes[0].id;
  return o;
}
var S=null, storageOk=true;
try{var raw=localStorage.getItem(KEY); if(raw){S=JSON.parse(raw);}}catch(e){S=null;}
try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t');}catch(e){storageOk=false;}
if(!S||!Array.isArray(S.classes)||!S.classes.length||!Array.isArray(S.students)){S=seed();}
S=normalize(S);
function save(){
  if(!storageOk)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;render(true);}
}
function cls(){return S.classes.filter(function(c){return c.id===S.currentClass;})[0]||S.classes[0];}
function studs(){var id=cls().id;return S.students.filter(function(s){return s.classId===id;});}
function dayRec(date){var a=S.attendance[cls().id];return (a&&a[date])||{};}
function attStats(sid){
  var a=S.attendance[cls().id]||{},h=0,t=0;
  for(var d in a){var c=a[d][sid];if(c){t++;if(c==='H')h++;}}
  return {h:h,t:t};
}
function studentAvg(sid,r){
  var v=[];['k','p'].forEach(function(k){var x=aspectNum(sid,k,r).v;if(x!=null)v.push(x);});
  return mean(v);
}
function classAvgs(st,r){
  var out={k:[],p:[],L:{A:0,B:0,C:0,D:0}};
  st.forEach(function(s){
    ['k','p'].forEach(function(k){var x=aspectNum(s.id,k,r).v;if(x!=null)out[k].push(x);});
    var g=attGrade(s.id,r);if(g.letter)out.L[g.letter]++;
  });
  out.k=mean(out.k);out.p=mean(out.p);
  return out;
}
/* tests[classId][kind][topic][date][studentId] = score */
function typeList(kind){return kind==='basic'?S.basicTypes:S.materials;}
function topicsFor(kind){
  var id=cls().id;
  return typeList(kind).filter(function(m){return m.classId===id;}).map(function(m){return {key:m.id,name:m.name};});
}
function topicName(kind,key){
  var f=typeList(kind).filter(function(t){return t.id===key;})[0];
  return f?f.name:'(removed)';
}
function sheetData(kind,topic,date){
  var t=S.tests[cls().id];
  return (t&&t[kind]&&t[kind][topic]&&t[kind][topic][date])||{};
}
function sheetDates(kind,topic){
  var t=S.tests[cls().id],k=t&&t[kind];
  return (k&&k[topic]?Object.keys(k[topic]):[]).sort().reverse();
}
function hasScores(kind,topic,date){return Object.keys(sheetData(kind,topic,date)).length>0;}
function setTest(kind,topic,date,sid,val){
  var cid=cls().id,t=S.tests[cid]||(S.tests[cid]={}),k=t[kind]||(t[kind]={}),tp=k[topic]||(k[topic]={}),d=tp[date]||(tp[date]={});
  if(val==null)delete d[sid];else d[sid]=val;
  if(!Object.keys(d).length)delete tp[date];
  if(!Object.keys(tp).length)delete k[topic];
  if(!Object.keys(k).length)delete t[kind];
  if(!Object.keys(t).length)delete S.tests[cid];
}

/* ---------- automatic aspect scores ---------- */
function semesterOf(a){
  var y=a.getFullYear(),s,e,label,sub;
  if(a.getMonth()>=6){s=new Date(y,6,1);e=new Date(y,11,31);label='Semester 1 · '+y+'/'+(y+1);sub='July – December '+y;}
  else{s=new Date(y,0,1);e=new Date(y,5,30);label='Semester 2 · '+(y-1)+'/'+y;sub='January – June '+y;}
  return {start:iso(s),end:iso(e),label:label,sub:sub};
}
function aRange(){return semesterOf(parseDate(ui.adate));}
function srcKinds(src){return src==='basic'?['basic']:src==='material'?['material']:src==='both'?['basic','material']:[];}
function testValues(sid,kinds,r){
  var t=S.tests[cls().id]||{},out=[];
  kinds.forEach(function(kind){
    var tops=t[kind]||{};
    for(var tp in tops)for(var d in tops[tp]){
      if(d<r.start||d>r.end)continue;
      var v=tops[tp][d][sid];if(typeof v==='number')out.push(v);
    }
  });
  return out;
}
function aspectNum(sid,k,r){
  var src=S.settings[k];
  if(src==='manual'){var g=S.grades[sid]||{};return {v:typeof g[k]==='number'?g[k]:null,n:null};}
  var v=testValues(sid,srcKinds(src),r);
  return {v:mean(v),n:v.length};
}
function attGrade(sid,r){
  var a=S.attendance[cls().id]||{},h=0,t=0,d,c,set=S.settings,letter=null;
  for(d in a){if(d<r.start||d>r.end)continue;c=a[d][sid];if(c){t++;if(c==='H')h++;}}
  if(t){letter=h*100<set.minPct*t?'D':h*100>=set.aPct*t?'A':h*100>=set.bPct*t?'B':'C';}
  return {h:h,t:t,pct:t?h*100/t:null,letter:letter,prov:t>0&&t<set.meetings};
}

/* ---------- summary ---------- */
function periodRange(){
  var a=parseDate(ui.pdate),s,e,label,sub='';
  if(ui.period==='week'){
    s=new Date(a);s.setDate(a.getDate()-((a.getDay()+6)%7));
    e=new Date(s);e.setDate(s.getDate()+6);
    label=shortDate(iso(s))+' – '+shortDate(iso(e));sub='Monday to Sunday';
  }else if(ui.period==='month'){
    s=new Date(a.getFullYear(),a.getMonth(),1);e=new Date(a.getFullYear(),a.getMonth()+1,0);
    label=s.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  }else{
    return semesterOf(a);
  }
  return {start:iso(s),end:iso(e),label:label,sub:sub};
}
function movePeriod(dir){
  var a=parseDate(ui.pdate);
  if(ui.period==='week')a.setDate(a.getDate()+7*dir);
  else if(ui.period==='month')a=new Date(a.getFullYear(),a.getMonth()+dir,1);
  else a=new Date(a.getFullYear(),a.getMonth()+6*dir,1);
  ui.pdate=iso(a);
}
function computeSummary(){
  var r=periodRange(),st=studs(),cid=cls().id,idx={};
  var rows=st.map(function(s){var x={s:s,c:{H:0,S:0,I:0,A:0},b:[],m:[],asp:{}};idx[s.id]=x;return x;});
  var days=0,a=S.attendance[cid]||{};
  for(var d in a){
    if(d<r.start||d>r.end)continue;
    var any=false;
    for(var sid in a[d]){if(idx[sid]){idx[sid].c[a[d][sid]]++;any=true;}}
    if(any)days++;
  }
  var sessions=[],t=S.tests[cid]||{};
  ['basic','material'].forEach(function(kind){
    var tops=t[kind]||{};
    for(var tp in tops){
      for(var dt in tops[tp]){
        if(dt<r.start||dt>r.end)continue;
        var vals=[];
        for(var s2 in tops[tp][dt]){
          if(idx[s2]){var v=tops[tp][dt][s2];vals.push(v);idx[s2][kind==='basic'?'b':'m'].push(v);}
        }
        if(vals.length)sessions.push({kind:kind,name:topicName(kind,tp),date:dt,avg:mean(vals),n:vals.length});
      }
    }
  });
  sessions.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0;});
  rows.forEach(function(x){

/* ---------- import names from Excel (.xlsx) or CSV ---------- */
function u8str(u8){return new TextDecoder('utf-8').decode(u8);}
async function inflateRaw(u8){
  var ds=new DecompressionStream('deflate-raw');
  var stream=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readZip(buf){
  var v=new DataView(buf),u8=new Uint8Array(buf),i,end=-1;
  for(i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(v.getUint32(i,true)===0x06054b50){end=i;break;}}
  if(end<0)throw new Error('zip');
  var n=v.getUint16(end+10,true),off=v.getUint32(end+16,true),files={};
  for(var k=0;k<n;k++){
    if(v.getUint32(off,true)!==0x02014b50)throw new Error('zip');
    var nl=v.getUint16(off+28,true),el=v.getUint16(off+30,true),cl=v.getUint16(off+32,true);
    files[u8str(u8.subarray(off+46,off+46+nl))]={method:v.getUint16(off+10,true),csize:v.getUint32(off+20,true),lho:v.getUint32(off+42,true)};
    off+=46+nl+el+cl;
  }
  return {files:files,read:async function(name){
    var f=files[name];if(!f)return null;
    var ln=v.getUint16(f.lho+26,true),le=v.getUint16(f.lho+28,true),start=f.lho+30+ln+le;
    var raw=u8.subarray(start,start+f.csize);
    if(f.method===0)return raw;
    if(f.method===8)return inflateRaw(raw);
    throw new Error('zip method');
  }};
}
function parseXml(s){return new DOMParser().parseFromString(s,'application/xml');}
function elsNS(node,name){return node.getElementsByTagNameNS('*',name);}
function colIndex(ref){var m=/^([A-Z]+)/.exec(ref||'');if(!m)return 0;var n=0;for(var i=0;i<m[1].length;i++)n=n*26+(m[1].charCodeAt(i)-64);return n-1;}
async function readXlsxRows(buf){
  var z=await readZip(buf),shared=[],t,i,j;
  t=await z.read('xl/sharedStrings.xml');
  if(t){var sis=elsNS(parseXml(u8str(t)),'si');for(i=0;i<sis.length;i++){var ts=elsNS(sis[i],'t'),str='';for(j=0;j<ts.length;j++)str+=ts[j].textContent;shared.push(str);}}
  var path=null,wb=await z.read('xl/workbook.xml'),rel=await z.read('xl/_rels/workbook.xml.rels');
  if(wb&&rel){
    var sh=elsNS(parseXml(u8str(wb)),'sheet')[0];
    if(sh){
      var rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id');
      var rl=elsNS(parseXml(u8str(rel)),'Relationship');
      for(i=0;i<rl.length;i++){if(rl[i].getAttribute('Id')===rid){var tg=rl[i].getAttribute('Target');path=tg.charAt(0)==='/'?tg.slice(1):'xl/'+tg;}}
    }
  }
  if(!path||!z.files[path])path=Object.keys(z.files).filter(function(n){return /^xl\/worksheets\/sheet\d+\.xml$/.test(n);}).sort()[0];
  if(!path)throw new Error('sheet');
  var cells=elsNS(parseXml(u8str(await z.read(path))),'c'),rows=[];
  for(i=0;i<cells.length;i++){
    var cell=cells[i],ref=cell.getAttribute('r')||'',ty=cell.getAttribute('t'),val=null,vs=elsNS(cell,'v')[0];
    if(ty==='s'&&vs)val=shared[Number(vs.textContent)];
    else if(ty==='inlineStr'){val='';var it=elsNS(cell,'t');for(j=0;j<it.length;j++)val+=it[j].textContent;}
    else if(vs)val=vs.textContent;
    var ri=parseInt(ref.replace(/[A-Z]+/,''),10)-1;
    if(val==null||isNaN(ri))continue;
    (rows[ri]=rows[ri]||[])[colIndex(ref)]=val;
  }

}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'';
  var delim=[',',';','\t'].map(function(d){return [d,first.split(d).length];}).sort(function(a,b){return b[1]-a[1];})[0][0];
  var rows=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<text.length;i++){
    ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(ch!=='\r')cur+=ch;
  }
  row.push(cur);rows.push(row);
  return rows;
}
function namesFromRows(rows){
  var hc=-1,hr=-1,i,j,out=[];
  for(i=0;i<Math.min(rows.length,8)&&hc<0;i++){
    var r=rows[i]||[];
    for(j=0;j<r.length;j++){if(r[j]!=null&&/^\s*(nama|name)\b/i.test(String(r[j]))){hc=j;hr=i;break;}}
  }
  for(i=hr+1;i<rows.length;i++){
    var row=rows[i]||[],v=null;
    if(hc>=0)v=row[hc];
    else for(j=0;j<row.length;j++){
      var x=row[j];
      if(x!=null&&String(x).trim()!==''&&!/^[\d\s.,]+$/.test(String(x))&&!/^\s*(no\.?|nomor|nis|nisn)\s*$/i.test(String(x))&&!/^\s*nama\b/i.test(String(x))){v=x;break;}
    }
    if(v==null)continue;
    v=String(v).replace(/\s+/g,' ').trim();
    if(v)out.push(v);
  }
  return out;
}
async function handleImportFile(file){
  try{
    var name=file.name.toLowerCase(),rows;
    if(/\.xls$/.test(name)){toast('Old .xls files are not supported. Save as .xlsx or .csv first.');return;}
    if(/\.(xlsx|xlsm)$/.test(name)){
      if(typeof DecompressionStream==='undefined'){toast('This browser cannot read Excel files. Save the sheet as CSV, or paste the names instead.');return;}
      rows=await readXlsxRows(await file.arrayBuffer());
    }else rows=parseCsv(await file.text());
    var all=namesFromRows(rows);
    if(!all.length){toast('No names found. Put the names in the Nama column of the template.');return;}
    var have={},fresh=[],skipped=0;
    studs().forEach(function(s){have[s.name.toLowerCase()]=1;});
    all.forEach(function(n){var k=n.toLowerCase();if(n.length>80)return;if(have[k]){skipped++;return;}have[k]=1;fresh.push(n);});
    ui.importPrev={names:fresh,skipped:skipped,file:file.name,classId:cls().id};
    render(true);
  }catch(e){toast('Could not read that file. Use the template, or save it as CSV.');}
}

function rand01(){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}catch(e){return Math.random();}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rand01()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function excludedIds(){var q=ui.quiz;if(!q.noRepeat)return [];return q.result?q.history.slice(0,-1):q.history;}
function quizPool(){

  var cand=studs().filter(function(s){return !q.presentOnly||today[s.id]==='H';});
  return {cand:cand,pool:cand.filter(function(s){return ex.indexOf(s.id)<0;})};
}

function resetQuiz(){var q=ui.quiz;q.token++;q.spinning=false;q.frozen=null;q.result=null;q.history=[];q.order=null;q.theta=0;q.sig='';}

      q.history.map(function(id,i){return '<span>'+(i+1)+'. '+esc(nameOf(id)||'?')+'</span>';}).join('')+'</div></section>';
  }

  if(q.order)h+='<ol class="ol">'+q.order.map(function(id){return '<li>'+esc(nameOf(id)||'?')+'</li>';}).join('')+'</ol>';

function fitText(ctx,s,maxW){
  if(ctx.measureText(s).width<=maxW)return s;
  var t=s;while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);
  return t+'…';
}
function drawWheel(){
  var cv=$('#wheel');if(!cv)return;
  var pool=ui.quiz.frozen||quizPool().pool,n=pool.length;if(!n)return;
  var css=getComputedStyle(document.documentElement);
  function tok(x){return css.getPropertyValue(x).trim();}
  var W=cv.clientWidth||300,dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(W*dpr);}
  var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,W);
  var cx=W/2,cy=W/2,R=W/2-14,seg=2*Math.PI/n,theta=ui.quiz.theta;
  var cols=[tok('--accent'),tok('--h'),tok('--s'),tok('--i'),tok('--a')],i;
  for(i=0;i<n;i++){
    var a0=theta+i*seg-Math.PI/2,ci=i%5;
    if(i===n-1&&n>1&&ci===0)ci=2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a0+seg);ctx.closePath();
    ctx.fillStyle=cols[ci];ctx.fill();
    if(n>1){ctx.strokeStyle=tok('--surface');ctx.lineWidth=1.5;ctx.stroke();}
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+seg/2);
    ctx.fillStyle=tok('--on');ctx.textAlign='right';ctx.textBaseline='middle';
    var fs=Math.max(8,Math.min(17,R*0.72*seg*0.62)),fam=tok('--font-body'),mw=R-40;
    ctx.font='600 '+fs+'px '+fam;
    while(fs>10&&ctx.measureText(pool[i].name).width>mw){fs-=1;ctx.font='600 '+fs+'px '+fam;}
    ctx.fillText(fitText(ctx,pool[i].name,mw),R-12,0);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,18,0,2*Math.PI);ctx.fillStyle=tok('--surface');ctx.fill();ctx.strokeStyle=tok('--line');ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-11,cy-R-8);ctx.lineTo(cx+11,cy-R-8);ctx.lineTo(cx,cy-R+14);ctx.closePath();
  ctx.fillStyle=tok('--ink');ctx.fill();ctx.strokeStyle=tok('--surface');ctx.lineWidth=2;ctx.stroke();
}
function startSpin(){
  var q=ui.quiz;if(q.spinning)return;
  q.result=null;
  var P=quizPool();
  if(!P.pool.length){render(true);return;}
  var sig=P.pool.map(function(s){return s.id;}).join(',');
  if(sig!==q.sig){q.theta=0;q.sig=sig;}
  q.spinning=true;q.frozen=P.pool;
  var token=++q.token,n=P.pool.length,seg=2*Math.PI/n,TAU=2*Math.PI;
  var idx=Math.floor(rand01()*n),f=0.15+rand01()*0.7;
  var theta0=q.theta,delta=((-(idx+f)*seg-theta0)%TAU+TAU)%TAU;
  var total=TAU*(5+Math.floor(rand01()*3))+delta;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dur=reduce?0:4200,t0=performance.now();
  render(true);
  function finish(){
    q.theta=theta0+total;q.spinning=false;q.frozen=null;
    q.history.push(P.pool[idx].id);q.result=P.pool[idx].id;
    if(ui.tab==='quiz'&&!ui.detail)render(true);
  }
  function frame(now){
    if(token!==q.token)return;
    var t=dur?Math.min(1,(now-t0)/dur):1;
    q.theta=theta0+total*(1-Math.pow(1-t,3));
    drawWheel();
    if(t<1)requestAnimationFrame(frame);else finish();
  }
  requestAnimationFrame(frame);
}

function setStatus(sid,code){
  var cid=cls().id,a=S.attendance[cid]||(S.attendance[cid]={}),r=a[ui.date]||(a[ui.date]={});
  if(r[sid]===code)delete r[sid];else r[sid]=code;
  if(!Object.keys(r).length)delete a[ui.date];

}
function addNames(list){
  var c=cls(),have={},added=0,skipped=0;
  studs().forEach(function(s){have[s.name.toLowerCase()]=1;});
  list.forEach(function(r){
    var n=r.replace(/^\s*\d+[.)]\s*/,'').replace(/\s+/g,' ').trim();
    if(!n||n.length>80)return;
    if(have[n.toLowerCase()]){skipped++;return;}
    have[n.toLowerCase()]=1;S.students.push({id:uid(),classId:c.id,name:n});added++;
  });
  save();
  return {added:added,skipped:skipped};
}
function removeStudents(ids){
  var set={};ids.forEach(function(i){set[i]=1;});
  S.students=S.students.filter(function(s){return !set[s.id];});
  ids.forEach(function(i){delete S.grades[i];delete S.notes[i];});
  var cid,d,kind,tp;
  for(cid in S.attendance){for(d in S.attendance[cid]){
    ids.forEach(function(i){delete S.attendance[cid][d][i];});
    if(!Object.keys(S.attendance[cid][d]).length)delete S.attendance[cid][d];
  }}
  for(cid in S.tests){
    var kinds=S.tests[cid];
    for(kind in kinds){
      var tops=kinds[kind];
      for(tp in tops){
        var dts=tops[tp];
        for(d in dts){
          ids.forEach(function(i){delete dts[d][i];});
          if(!Object.keys(dts[d]).length)delete dts[d];
        }
        if(!Object.keys(dts).length)delete tops[tp];
      }
      if(!Object.keys(tops).length)delete kinds[kind];
    }
    if(!Object.keys(kinds).length)delete S.tests[cid];
  }
}

    ui.tab='grades';ui.gsub=t.dataset.kind;ui.topic[t.dataset.kind]=t.dataset.topic;ui.gdate=t.dataset.date;ui.detail=null;ui.confirm=null;return render(false);
  }
  if(act==='open-student'){ui.detail=sid;ui.confirm=null;return render(false);}
  if(act==='back'){ui.detail=null;return render(false);}
  if(act==='cancel'){ui.confirm=null;return render(true);}
  if(act==='aprev'||act==='anext'){var ad=parseDate(ui.adate);ui.adate=iso(new Date(ad.getFullYear(),ad.getMonth()+(act==='anext'?6:-6),1));return render(true);}
  if(act==='athis'){ui.adate=todayStr();return render(true);}
  if(act==='template'){
    try{saveFile('Template daftar siswa.xlsx',buildTemplate());toast('Template saved. Look in your Downloads folder.');}
    catch(x){toast('Could not create the template.');}
    return;
  }
  if(act==='import-cancel'){ui.importPrev=null;return render(true);}
  if(act==='import-yes'){
    var ip=ui.importPrev;
    if(!ip||ip.classId!==cls().id){ui.importPrev=null;return render(true);}
    var ir=addNames(ip.names);ui.importPrev=null;
    toast(ir.added+' student'+(ir.added===1?'':'s')+' added to '+cls().name+'.');return render(true);
  }
  if(act==='qspin')return startSpin();
  if(act==='qreset'){resetQuiz();return render(true);}
  if(act==='qorder'){
    var qc=quizPool().cand;
    if(!qc.length){toast('No students to shuffle.');return;}
    ui.quiz.order=shuffle(qc.map(function(s){return s.id;}));return render(true);
  }
  if(act==='qorder-clear'){ui.quiz.order=null;return render(true);}
  if(act==='goto-students'){ui.tab='students';return render(false);}
  if(act==='allpresent'){
    var cid=cls().id,a=S.attendance[cid]||(S.attendance[cid]={}),r=a[ui.date]||(a[ui.date]={});
    studs().forEach(function(s){if(!r[s.id])r[s.id]='H';});
    save();return render(true);
  }
  if(act==='clearday'){ui.confirm={type:'clearday'};return render(true);}
  if(act==='clearday-yes'){var aa=S.attendance[cls().id];if(aa)delete aa[ui.date];ui.confirm=null;save();toast('Day cleared.');return render(true);}
  if(act==='period'){ui.period=t.dataset.p;ui.summaryText='';return render(true);}
  if(act==='pprev'){movePeriod(-1);ui.summaryText='';return render(true);}
  if(act==='pnext'){movePeriod(1);ui.summaryText='';return render(true);}
  if(act==='pthis'){ui.pdate=todayStr();ui.summaryText='';return render(true);}
  if(act==='xlsx'){
    try{saveFile('Register '+safeName(cls().name)+' '+todayStr()+'.xlsx',buildXlsx(buildWorkbook()));toast('Excel file created. Look in your Downloads folder.');}
    catch(x){toast('Could not create the Excel file.');}
    return;
  }
  if(act==='savebackup'){
    try{saveFile('Register backup '+todayStr()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));toast('Backup file saved. Look in your Downloads folder.');}
    catch(x){toast('Could not save the backup file.');}
    return;
  }
  if(act==='copysum'){
    return clipboardCopy(summaryTSV(),'Summary copied. Paste it into a spreadsheet or Notes.',function(txt){ui.summaryText=txt;render(true);var ta=$('#summaryText');if(ta){ta.focus();ta.select();}});
  }
  if(act==='clear-ex'){
    removeStudents(S.students.filter(function(s){return s.ex;}).map(function(s){return s.id;}));
    save();toast('Examples removed.');return render(true);
  }
  if(act==='bulk'){
    var r2=addNames(($('#bulk').value||'').split(/\r?\n/));
    toast(r2.added+' added'+(r2.skipped?', '+r2.skipped+' already in the list':'')+'.');return render(true);
  }
  if(act==='sort'){
    var cid2=cls().id,others=S.students.filter(function(s){return s.classId!==cid2;});
    var mine=studs().sort(function(x,y){return x.name.localeCompare(y.name,'id');});
    S.students=others.concat(mine);save();return render(true);
  }
  if(act==='del-ask'){ui.confirm={type:'student',id:sid};return render(true);}
  if(act==='del-yes'){removeStudents([sid]);ui.confirm=null;save();toast('Student deleted.');return render(true);}
  if(act==='topicdel'){ui.confirm={type:'topic'};ui.topicOpen=true;return render(true);}
  if(act==='topicdel-yes'){
    var kd=ui.gsub,mid=ui.topic[kd],cid3=cls().id;
    if(kd==='basic')S.basicTypes=S.basicTypes.filter(function(m){return m.id!==mid;});
    else S.materials=S.materials.filter(function(m){return m.id!==mid;});
    var tk=S.tests[cid3];
    if(tk&&tk[kd]){delete tk[kd][mid];if(!Object.keys(tk[kd]).length)delete tk[kd];if(!Object.keys(tk).length)delete S.tests[cid3];}
    ui.topic[kd]=null;ui.confirm=null;save();toast('Deleted.');return render(true);
  }
  if(act==='delclass'){ui.confirm={type:'class'};return render(true);}
  if(act==='delclass-yes'){
    var id=cls().id;
    removeStudents(S.students.filter(function(s){return s.classId===id;}).map(function(s){return s.id;}));
    delete S.attendance[id];delete S.tests[id];
    S.materials=S.materials.filter(function(m){return m.classId!==id;});
    S.basicTypes=S.basicTypes.filter(function(m){return m.classId!==id;});
    S.classes=S.classes.filter(function(c){return c.id!==id;});
    S.currentClass=S.classes[0].id;ui.confirm=null;ui.topic.material=null;ui.topic.basic=null;ui.importPrev=null;resetQuiz();save();toast('Class deleted.');return render(false);
  }
  if(act==='copy'){
    return clipboardCopy(JSON.stringify(S),'Backup copied. Paste it into Notes or send it to yourself.',function(txt){ui.backupText=txt;render(true);var ta=$('#backupText');if(ta){ta.focus();ta.select();}});
  }
  if(act==='restore-ask'){
    if(!ui.restoreDraft.trim())return toast('Paste a backup first.');
    if(!parseBackup(ui.restoreDraft))return toast('That does not look like a backup.');
    ui.confirm={type:'restore'};return render(true);
  }
  if(act==='restore-yes'){
    var o=parseBackup(ui.restoreDraft);if(!o)return;
    S=normalize(o);
    ui.confirm=null;ui.restoreDraft='';ui.backupText='';ui.topic.material=null;ui.topic.basic=null;ui.importPrev=null;resetQuiz();save();toast('Backup restored.');return render(false);
  }
});
$('#view').addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='restoreText'){ui.restoreDraft=t.value;return;}
  if(t.id==='noteText'){
    var v=t.value;
    if(v.trim())S.notes[t.dataset.sid]=v;else delete S.notes[t.dataset.sid];
    save();return;
  }
  if(!t.matches)return;
  if(t.matches('input[data-test]'))onTest(t);
  else if(t.matches('input[data-k]'))onAspect(t);
});
$('#view').addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dateInput'){if(t.value)setDate(t.value);return;}
  if(t.id==='gDateInput'){if(t.value)setGDate(t.value);return;}
  if(t.id==='importFile'){var f0=t.files&&t.files[0];if(f0)handleImportFile(f0);return;}
  if(t.id==='qPresent'){ui.quiz.presentOnly=t.checked;ui.quiz.sig='';return render(true);}
  if(t.id==='qNoRepeat'){ui.quiz.noRepeat=t.checked;ui.quiz.sig='';return render(true);}
  if(t.id==='setK'||t.id==='setP'){S.settings[t.id==='setK'?'k':'p']=t.value;ui.setOpen=true;save();return render(true);}
  if(t.id==='setMeet'||t.id==='setMin'||t.id==='setA'||t.id==='setB'){
    var sv=Number(String(t.value).replace(',','.')),ns=Object.assign({},S.settings);
    if(t.id==='setMeet')ns.meetings=Math.round(sv);else if(t.id==='setMin')ns.minPct=sv;else if(t.id==='setA')ns.aPct=sv;else ns.bPct=sv;
    if(isFinite(sv)&&ns.meetings>=1&&ns.meetings<=60&&ns.minPct>0&&ns.minPct<=ns.bPct&&ns.bPct<=ns.aPct&&ns.aPct<=100){S.settings=ns;save();}
    else toast('Check the numbers: minimum is not above B, B is not above A, and A is at most 100.');
    ui.setOpen=true;return render(true);
  }
  if(t.id==='restoreFile'){
    var f=t.files&&t.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var txt=String(rd.result);
      if(parseBackup(txt)){ui.restoreDraft=txt;ui.confirm={type:'restore'};render(true);}
      else toast('That file does not look like a backup.');
    };
    rd.onerror=function(){toast('Could not read that file.');};
    rd.readAsText(f);return;
  }
  if(t.id==='clsName'){var v=t.value.replace(/\s+/g,' ').trim();if(v){cls().name=v;save();renderClassSel();}else{t.value=cls().name;}return;}
  if(t.id==='topicName'){
    var nv=t.value.replace(/\s+/g,' ').trim(),tm=typeList(ui.gsub).filter(function(x){return x.id===ui.topic[ui.gsub];})[0];
    if(tm&&nv){tm.name=nv;save();}
    render(true);return;
  }
  if(t.classList&&t.classList.contains('nameedit')){
    var s=S.students.filter(function(x){return x.id===t.dataset.sid;})[0],nn=t.value.replace(/\s+/g,' ').trim();
    if(s&&nn){s.name=nn;save();}else{render(true);}
  }
});
$('#view').addEventListener('toggle',function(e){if(e.target.id==='topicDetails')ui.topicOpen=e.target.open;else if(e.target.id==='setDetails')ui.setOpen=e.target.open;},true);
$('#view').addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='addForm'){
    var r=addNames([$('#newName').value]);
    if(!r.added&&r.skipped)toast('That name is already in this class.');
    render(true);var n=$('#newName');if(n)n.focus();
  }else if(e.target.id==='addClass'){
    var name=$('#newClass').value.replace(/\s+/g,' ').trim();
    if(!name)return;
    var c={id:uid(),name:name};S.classes.push(c);S.basicTypes=S.basicTypes.concat(defaultBasic(c.id));S.currentClass=c.id;ui.topic.material=null;ui.topic.basic=null;ui.importPrev=null;resetQuiz();save();toast('Class added.');render(false);
  }else if(e.target.id==='addTopic'){
    var kd2=ui.gsub,mn=$('#newTopic').value.replace(/\s+/g,' ').trim();
    if(!mn)return;
    var dup=topicsFor(kd2).some(function(x){return x.name.toLowerCase()===mn.toLowerCase();});
    if(dup){toast('That name is already used in this class.');return;}
    var mat={id:uid(),classId:cls().id,name:mn};typeList(kd2).push(mat);ui.topic[kd2]=mat.id;ui.topicOpen=true;save();
    render(true);var nm=$('#newTopic');if(nm)nm.focus();
  }
});
$('#classSel').addEventListener('change',function(e){S.currentClass=e.target.value;ui.confirm=null;ui.detail=null;ui.topic.material=null;ui.topic.basic=null;ui.importPrev=null;resetQuiz();save();render(false);});
document.querySelector('.tabbar').addEventListener('click',function(e){
  var b=e.target.closest('button[data-tab]');if(!b)return;
  ui.tab=b.dataset.tab;ui.confirm=null;ui.detail=null;render(false);
});

window.addEventListener('resize',function(){drawWheel();});
render(false);
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
